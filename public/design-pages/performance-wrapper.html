<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Performance Marketing | IdeaWonder AI</title><meta name="description" content="Performance marketing services by IdeaWonder AI."><style>*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;overflow-x:hidden}iframe{display:block;width:100%;border:0;min-height:100vh}</style></head><body><iframe id="performance" src="/design-pages/performance-marketing.html" title="Performance Marketing"></iframe><script>
const frame=document.getElementById('performance');
function sync(){try{const d=frame.contentDocument;if(!d)return;let link=d.querySelector('link[data-iw-brand]');if(!link){link=d.createElement('link');link.rel='stylesheet';link.href='/brand/brand-consistency.css';link.dataset.iwBrand='1';d.head.appendChild(link)}if(!d.querySelector('script[data-iw-brand]')){const s=d.createElement('script');s.src='/brand/brand-consistency.js';s.dataset.iwBrand='1';d.body.appendChild(s)}frame.style.height=Math.max(d.documentElement.scrollHeight,d.body.scrollHeight,900)+'px'}catch(e){}}
frame.addEventListener('load',()=>{sync();setTimeout(sync,500);setTimeout(sync,1500);if('ResizeObserver'in window){const ro=new ResizeObserver(sync);try{ro.observe(frame.contentDocument.documentElement)}catch(e){}}});
window.addEventListener('resize',sync);
</script></body></html>
